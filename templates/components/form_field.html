<div class="field{% if wide %} full{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="row" for="{{ field.id_for_label }}" style="font-weight:600">
      {{ field }} <span>{{ field.label }}</span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
